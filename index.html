<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talks</title>
<style>
:root { --bg: #111214; --panel: #1b1d21; --line: #2c2f35; --fg: #e8e8ea; --dim: #9a9ca3; --accent: #e8743b; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
a { color: var(--fg); }
a:hover { color: var(--accent); }

main { max-width: 860px; margin: 0 auto; padding: 32px 16px; }
h1 { font-size: 24px; margin: 0 0 24px; }
.card { display: flex; gap: 20px; padding: 16px; margin-bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; text-decoration: none; }
.card:hover { border-color: var(--accent); }
.card img { width: 240px; aspect-ratio: 16 / 9; flex-shrink: 0; border-radius: 3px; background: #fff; }
.card h2 { font-size: 18px; margin: 0 0 4px; }
.card .m { color: var(--dim); font-size: 13px; }
.card p { margin: 8px 0 0; color: var(--dim); }
@media (max-width: 640px) { .card { flex-direction: column; } .card img { width: 100%; } }
</style>
</head>
<body>
<main>
<h1>Talks</h1>
<a class="card" href="demystifying-agentic/">
  <img src="demystifying-agentic/slides/thumb/01.webp" alt="" loading="lazy">
  <div><h2>Demystifying Agentic AI</h2><div class="m">2026-09-24</div><p>The agentic AI stack, taken apart through a security lens: harnesses, the agent loop, subagents, skills, hooks, MCP, memory, plugins and sandboxing, and where the trust boundaries sit between them.</p></div>
</a>
</main>
</body>
</html>
