const pad = (n) => String(n).padStart(2, "0");
const img = document.getElementById("slide"), strip = document.getElementById("strip"), count = document.getElementById("count");
const cache = new Map();
const warm = (n) => { if (n >= 1 && n <= slides.length && !cache.has(n)) { const i = new Image(); i.src = "slides/" + pad(n) + ".webp"; cache.set(n, i); } };
const thumbs = slides.map((s) => {
  const b = document.createElement("button");
  b.setAttribute("role", "tab"); b.title = "Slide " + s.n;
  b.innerHTML = '<img loading="lazy" src="slides/thumb/' + pad(s.n) + '.webp" alt="">';
  b.onclick = () => go(s.n);
  strip.appendChild(b); return b;
});
let cur = 0;
function go(n, push = true) {
  n = Math.max(1, Math.min(slides.length, n));
  if (n === cur) return;
  if (cur) thumbs[cur - 1].removeAttribute("aria-current");
  cur = n;
  img.src = "slides/" + pad(n) + ".webp";
  img.alt = slides[n - 1].alt || "Slide " + n;
  thumbs[n - 1].setAttribute("aria-current", "true");
  thumbs[n - 1].scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  count.textContent = n + " / " + slides.length;
  if (push) history.replaceState(null, "", "#" + n);
  warm(n + 1); warm(n + 2); warm(n - 1);
}
document.getElementById("prev").onclick = () => go(cur - 1);
document.getElementById("next").onclick = () => go(cur + 1);
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "j") go(cur + 1);
  else if (k === "ArrowLeft" || k === "PageUp" || k === "k") go(cur - 1);
  else if (k === "Home") go(1);
  else if (k === "End") go(slides.length);
  else if (k === "f") toggleFs();
  else return;
  e.preventDefault();
});
let x0 = null;
const stage = document.getElementById("stage");
stage.addEventListener("pointerdown", (e) => { x0 = e.clientX; });
stage.addEventListener("pointerup", (e) => { if (x0 !== null && Math.abs(e.clientX - x0) > 40) go(cur + (e.clientX < x0 ? 1 : -1)); x0 = null; });
function toggleFs() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
document.getElementById("fs").onclick = toggleFs;
window.addEventListener("hashchange", () => go(parseInt(location.hash.slice(1)) || 1, false));
go(parseInt(location.hash.slice(1)) || 1, false);
